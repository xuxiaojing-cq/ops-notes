name: Notes CI

on:
  push:
    branches:
      - main
      - ci/day11-actions
      - ci/day12-tests-artifacts
      - ci/day13-docker-build
      - ci/day14-image-publish
      - ci/day16-rollback-drill
      - ci/day18-deploy
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish verified image to GHCR (main only)"
        required: true
        type: boolean
        default: false
      deploy:
        description: "Deploy published image to ECS via Ansible (main only)"
        required: true
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  check-markdown:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Markdown and generate report
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          python scripts/check_notes.py 2>&1 | tee reports/notes-check.txt

      - name: Upload check report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: notes-check-report
          path: reports/notes-check.txt
          if-no-files-found: warn
          retention-days: 7

  docker-smoke:
    needs: check-markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -t ci-web:${{ github.sha }} examples/ci-web

      - name: Start container
        run: |
          docker run -d \
            --name day13-ci-web \
            -e APP_GREETING=ci-demo \
            -p 127.0.0.1:18080:8080 \
            ci-web:${{ github.sha }}

      - name: Verify HTTP and runtime user
        shell: bash
        run: |
          ready=false

          for attempt in $(seq 1 15); do
            echo "Health check attempt: $attempt"

            if curl --fail --show-error --silent \
              --max-time 2 \
              http://127.0.0.1:18080/healthz \
              -o health-response.txt; then
              if [ "$(cat health-response.txt)" = "ok" ]; then
                ready=true
                break
              fi
            fi

            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "ERROR: health check did not return ok"
            exit 1
          fi

          echo "Health response:"
          cat health-response.txt

          echo "Runtime user:"
          docker exec day13-ci-web id
          test "$(docker exec day13-ci-web id -u)" = "10001"
          test "$(docker exec day13-ci-web id -g)" = "10001"

      - name: Log in to GHCR
        id: ghcr-login
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Publish verified image
        id: publish
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -o pipefail

          owner="${IMAGE_OWNER,,}"
          image="ghcr.io/${owner}/ci-web:sha-${COMMIT_SHA}"

          mkdir -p reports/docker

          docker tag "ci-web:${COMMIT_SHA}" "$image"
          docker push "$image" 2>&1 | tee reports/docker/push.log

          digest="$(grep -oE 'digest: sha256:[0-9a-f]{64}' reports/docker/push.log | tail -1 | awk '{print $2}')"

          if [ -z "$digest" ]; then
            echo "ERROR: could not read digest from push output" >&2
            exit 1
          fi

          image_ref="ghcr.io/${owner}/ci-web@${digest}"

          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image}" >> "$GITHUB_OUTPUT"

          {
            echo "## Published image"
            echo
            echo "- Image tag: \`$image\`"
            echo "- Image digest ref: \`$image_ref\`"
            echo "- Source commit: \`$COMMIT_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR
        if: ${{ always() && steps.ghcr-login.outcome == 'success' }}
        run: docker logout ghcr.io

      - name: Collect container diagnostics
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p reports/docker
          docker ps -a > reports/docker/containers.txt 2>&1
          docker logs day13-ci-web > reports/docker/container.log 2>&1 || true
          docker inspect day13-ci-web > reports/docker/inspect.json 2>&1 || true

          if [ -f health-response.txt ]; then
            cp health-response.txt reports/docker/
          fi

      - name: Upload container diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-diagnostics
          path: reports/docker/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove test container
        if: ${{ always() }}
        run: docker rm -f day13-ci-web || true

  deploy:
    needs: docker-smoke
    if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.deploy && inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read

    env:
      IMAGE_REF: ${{ needs.docker-smoke.outputs.image_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Ansible
        run: |
          python3 -m pip install --quiet 'ansible-core==2.18.*'

      - name: Prepare SSH access and inventory
        shell: bash
        env:
          WORK_DIR: ${{ runner.temp }}/ansible-deploy
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "${IMAGE_REF}" ]; then
            echo "ERROR: image_ref is empty; publish step did not run" >&2
            exit 1
          fi

          install -d -m 700 "$WORK_DIR"

          printf '%s\n' "$ECS_SSH_KEY" > "$WORK_DIR/deploy_key"
          chmod 600 "$WORK_DIR/deploy_key"

          printf '%s\n' "$ECS_KNOWN_HOSTS" > "$WORK_DIR/known_hosts"
          chmod 600 "$WORK_DIR/known_hosts"

          cat > "$WORK_DIR/ansible.cfg" <<EOF
          [defaults]
          inventory = $WORK_DIR/inventory.ini
          host_key_checking = True
          display_skipped_hosts = True
          EOF

          cat > "$WORK_DIR/inventory.ini" <<EOF
          [web]
          target ansible_host=$ECS_HOST ansible_user=$ECS_USER ansible_ssh_private_key_file=$WORK_DIR/deploy_key ansible_ssh_common_args='-o IdentitiesOnly=yes -o UserKnownHostsFile=$WORK_DIR/known_hosts -o StrictHostKeyChecking=yes'
          EOF

          echo "deploying image: $IMAGE_REF"

      - name: Run Ansible deploy
        env:
          WORK_DIR: ${{ runner.temp }}/ansible-deploy
        run: |
          export ANSIBLE_CONFIG="$WORK_DIR/ansible.cfg"
          ansible-playbook \
            -i "$WORK_DIR/inventory.ini" \
            05-cicd/ansible/deploy-ci-web.yml \
            -e "app_name=gha-ci-web" \
            -e "app_port=18084" \
            -e "app_image=$IMAGE_REF"

      - name: Verify deployed container
        shell: bash
        env:
          WORK_DIR: ${{ runner.temp }}/ansible-deploy
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          ssh -i "$WORK_DIR/deploy_key" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$WORK_DIR/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "${ECS_USER}@${ECS_HOST}" \
            "docker ps --filter name=gha-ci-web --format '{{.Names}} {{.Status}} {{.Ports}}' && curl -fsS --max-time 5 http://127.0.0.1:18084/healthz"

      - name: Remove deployment credentials
        if: ${{ always() }}
        shell: bash
        env:
          WORK_DIR: ${{ runner.temp }}/ansible-deploy
        run: |
          shred -u "$WORK_DIR/deploy_key" 2>/dev/null || rm -f "$WORK_DIR/deploy_key"
          rm -rf "$WORK_DIR"
