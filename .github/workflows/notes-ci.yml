name: Notes CI

on:
  push:
    branches:
      - main
      - ci/day11-actions
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-markdown:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6B
        with:
          python-version: "3.12"

      - name: Check Markdown files
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          output = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.md"]
          )
          files = [
              Path(name.decode("utf-8"))
              for name in output.split(b"\0")
              if name
          ]

          errors = []

          if Path("README.md") not in files:
              errors.append("README.md is missing from tracked files")

          for path in files:
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeError:
                  errors.append(f"{path}: invalid UTF-8")
                  continue

              if not text.strip():
                  errors.append(f"{path}: empty Markdown file")

              if "\0" in text:
                  errors.append(f"{path}: contains a NUL character")

              print(f"Checked: {path}")

          if errors:
              for error in errors:
                  print(f"ERROR: {error}", file=sys.stderr)
              sys.exit(1)

          print(f"PASS: checked {len(files)} Markdown files")
          PY
